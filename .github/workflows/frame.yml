name: refresh frame

# No push trigger: this job commits page.gif and would re-run on itself.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-frame
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow && sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core
      - name: Render page.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/frame.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- page.gif)" ]; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page.gif
          git commit -m "frame: refresh"
          git push
